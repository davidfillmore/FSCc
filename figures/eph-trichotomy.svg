<text x='460' y='374' font-size='13' fill='#222' font-family='Helvetica, Arial, sans-serif'>Orbits of the unipotent subgroup fixing the single</text><text x='460' y='392' font-size='13' fill='#222' font-family='Helvetica, Arial, sans-serif'>boundary point 0: the horocycles at 0.</text><text x='460' y='410' font-size='13' fill='#222' font-family='Helvetica, Arial, sans-serif'>One fixed point on the line: the parabolic case.</text>
