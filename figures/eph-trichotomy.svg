<text x='30' y='374' font-size='13' fill='#222' font-family='Helvetica, Arial, sans-serif'>Orbits of the subgroup fixing the interior point i:</text><text x='30' y='392' font-size='13' fill='#222' font-family='Helvetica, Arial, sans-serif'>the circles about i. Both fixed points are conjugate,</text><text x='30' y='410' font-size='13' fill='#222' font-family='Helvetica, Arial, sans-serif'>off the line: Kisil&#x27;s elliptic case, Shaska&#x27;s definite signs.</text>
