<text x='890' y='374' font-size='13' fill='#222' font-family='Helvetica, Arial, sans-serif'>Orbits of the torus fixing two boundary points: the</text><text x='890' y='392' font-size='13' fill='#222' font-family='Helvetica, Arial, sans-serif'>arcs through them. The stabilizer of the slicing datum</text><text x='890' y='410' font-size='13' fill='#222' font-family='Helvetica, Arial, sans-serif'>fixes its double and its simple root: the counterexample&#x27;s grading.</text>
